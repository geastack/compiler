name: ci

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/**
      - test/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      node-compat-ref:
        description: The geastack/node-compat commit to build against.
        type: string
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This job was a reusable workflow in geastack/pipelines. A public repository
# cannot call a reusable workflow that lives in a private one, so the job and
# the shell it runs now live here, under scripts/ci/.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The native tests compile against core's headers and drive its geatsc
    # plugin, from a sibling checkout the way a developer tree lays them out.
    env:
      GEA_CORE: ${{ github.workspace }}/core/packages/core
      GEA_CORE_ROOT: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@v7
        with:
          path: compiler
      - name: Check out core, whose headers and plugin the native tests use
        uses: actions/checkout@v7
        with:
          repository: geastack/core
          token: ${{ secrets.GEA_CI_TOKEN || github.token }}
          path: core
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            compiler/package-lock.json
            core/packages/geatsc-plugin-gea/package-lock.json
      - name: Build core's geatsc plugin
        working-directory: core/packages/geatsc-plugin-gea
        run: npm ci --ignore-scripts && npm run build
      - working-directory: compiler
        run: npm ci --ignore-scripts
      - working-directory: compiler
        run: npm test

  hono-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NODE_COMPAT_REF: ${{ inputs.node-compat-ref || 'main' }}

    steps:
      - name: Check out the compiler under test, where node-compat's build driver expects it
        uses: actions/checkout@v7
        with:
          path: compiler

      # GEA_CI_TOKEN is only needed while these repositories are private; once
      # they are readable without it the default job token is enough.
      - name: Check out node-compat, which holds the app and the runtime
        uses: actions/checkout@v7
        with:
          repository: geastack/node-compat
          ref: ${{ env.NODE_COMPAT_REF }}
          token: ${{ secrets.GEA_CI_TOKEN || github.token }}
          path: node-compat

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            compiler/package-lock.json
            node-compat/apps/hono-hello/package-lock.json

      - name: Report the toolchain
        run: compiler/scripts/ci/shared/report-toolchain.sh

      - name: Build the compiler from the locked npm dependencies
        run: compiler/scripts/ci/shared/npm-build.sh compiler

      - name: Install node-compat's dependencies and the unmodified hono package; install the packed compiler under test
        run: compiler/scripts/ci/node-compat/hono-hello/install.sh

      - name: Transpile hono-hello to C++ and link it with clang++
        run: compiler/scripts/ci/node-compat/hono-hello/build.sh

      - name: Start the binary and verify both routes byte for byte
        run: compiler/scripts/ci/node-compat/hono-hello/verify.sh

      - name: Summarize which commits were built
        if: always()
        env:
          COMPILER_REF: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: compiler/scripts/ci/shared/summarize.sh hono-hello

      - name: Report the result to Slack, when a webhook is configured
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "hono-hello *${{ job.status }}* | compiler `${{ github.sha }}` | node-compat `${{ env.NODE_COMPAT_REF }}`\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
